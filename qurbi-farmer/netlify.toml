# Netlify settings for the farmer app (qurbi-farmer).
# If this repo is deployed as a monorepo, set "Base directory" to qurbi-farmer.
# This app is a private working area, so it is kept out of search engines.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Client-side routes (/livestock, /orders, /admin ...) all load the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Robots-Tag = "noindex, nofollow"
